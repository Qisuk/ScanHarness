# Builds the solution and runs the unit and Playwright UI tests.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: ScanHarness/ScanHarness.slnx

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build "$SOLUTION" -c Release

      - name: Unit tests
        run: |
          dotnet test ScanHarness.Tests -c Release --no-build --logger trx --results-directory test-results
          dotnet test DemoToolAPI_1.Tests -c Release --no-build --logger trx --results-directory test-results

      - name: Install Playwright browser
        run: pwsh ScanHarness.UITests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: UI tests
        run: dotnet test ScanHarness.UITests -c Release --no-build --logger trx --results-directory test-results

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test-results/
            /tmp/scanharness-uitest-server.log
          if-no-files-found: ignore
