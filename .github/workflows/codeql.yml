# GitHub CodeQL (SAST) with alerts in the repo's Security tab. Code scanning on a private repository
# needs GitHub Code Security, so this only runs once the repository variable CODE_SECURITY_ENABLED is
# set to true (Settings > Secrets and variables > Actions > Variables). Until then the job is skipped.
# To block pull requests on CodeQL alerts, add a code scanning rule in a branch ruleset for master.
name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: SAST · CodeQL (C#)
    if: ${{ vars.CODE_SECURITY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended

      - name: Build
        run: dotnet build ScanHarness/ScanHarness.slnx -c Release

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
